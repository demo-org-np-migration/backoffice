name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io/demo-org-np-migration

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backoffice-api, backoffice-ui]
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VITE_KEYCLOAK_REALM solo lo usa apps/backoffice-ui/Dockerfile — el de
      # backoffice-api declara el mismo ARG como no-op para que este step
      # sirva para las dos patas del matrix sin bifurcar el workflow.
      - name: Build and push (sha tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            VITE_KEYCLOAK_REALM=cauri-staging
          tags: ${{ env.REGISTRY }}/${{ matrix.app }}:${{ steps.tag.outputs.tag }}

      - name: Build and push (semver tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            VITE_KEYCLOAK_REALM=cauri-prod
          tags: ${{ env.REGISTRY }}/${{ matrix.app }}:${{ github.ref_name }}

  deploy-staging:
    needs: build
    runs-on: [self-hosted, cauri-k8s]
    strategy:
      matrix:
        app: [backoffice-api, backoffice-ui]
    steps:
      - uses: actions/checkout@v4

      - name: Apply staging manifests
        run: |
          sed "s/IMAGE_TAG/${{ needs.build.outputs.tag }}/" "k8s/staging/${{ matrix.app }}-"*.yaml | kubectl apply -n staging -f -

  deploy-prod:
    needs: [build, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, cauri-k8s]
    environment: production
    strategy:
      matrix:
        app: [backoffice-api, backoffice-ui]
    steps:
      - uses: actions/checkout@v4

      - name: Apply prod manifests
        run: |
          sed "s/IMAGE_TAG/${{ github.ref_name }}/" "k8s/prod/${{ matrix.app }}-"*.yaml | kubectl apply -n prod -f -
