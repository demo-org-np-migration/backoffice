server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Fallback SPA: cualquier ruta que no sea un archivo estático la resuelve
    # React Router... salvo que todavía no usamos router, así que hoy esto
    # solo importa para refrescos de página en "/".
    location / {
        try_files $uri $uri/ /index.html;
    }
}
