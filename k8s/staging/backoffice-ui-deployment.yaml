apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice-ui
  namespace: staging
  labels:
    app.kubernetes.io/name: backoffice-ui
    app.kubernetes.io/part-of: cauri
    cauri.io/team: core-banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backoffice-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backoffice-ui
        app.kubernetes.io/part-of: cauri
        cauri.io/team: core-banking
    spec:
      containers:
        - name: backoffice-ui
          image: ghcr.io/demo-org-np-migration/backoffice-ui:IMAGE_TAG
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
